  <script>
    // Typing Effect Script
    const phrase = "user:~$ I am a robotics engineer with expertise in: ";
    const skills = [
      " software development", " system design", " hardware-software integration",
      " embedded systems programming", " autonomous navigation and control",
      " sensor integration and data fusion", " control systems and kinematics",
      " computer vision and image processing", " machine learning and AI", " 3D modeling and printing"
    ];
    let phraseIndex = 0, skillIndex = 0, charIndex = 0, typing = true, isTypingPhrase = true;
    const staticTextElement = document.getElementById('static-text');
    const typingTextElement = document.getElementById('typing-text');
    const staticCursor = document.getElementById('static-cursor');
    const skillCursor = document.getElementById('skill-cursor');
    staticTextElement.textContent = ""; typingTextElement.style.display = 'none';
    function typeText(text, element, index) { element.innerHTML = text.slice(0, index); }
    function typeSkill() {
      if (isTypingPhrase) {
        typeText(phrase, staticTextElement, phraseIndex++);
        if (phraseIndex > phrase.length) {
          isTypingPhrase = false; staticCursor.style.display = 'none'; skillCursor.style.display = 'inline-block';
          document.getElementById('skill-wrapper').style.visibility = 'visible';
          typingTextElement.style.display = 'inline-block'; setTimeout(typeSkill, 1000); return;
        } setTimeout(typeSkill, 100);
      } else {
        const currentSkill = skills[skillIndex];
        if (charIndex === 0 && typing) { typingTextElement.style.display = 'inline-block'; typingTextElement.textContent = ""; }
        if (typing) {
          typeText(currentSkill, typingTextElement, charIndex++);
          if (charIndex > currentSkill.length) { typing = false; setTimeout(typeSkill, 2000); return; }
        } else {
          typingTextElement.textContent = currentSkill.slice(0, charIndex--);
          if (charIndex < 0) {
            typing = true; skillIndex = (skillIndex + 1) % skills.length;
            typingTextElement.style.display = 'none'; setTimeout(typeSkill, 500); return;
          }
        } setTimeout(typeSkill, typing ? 100 : 50);
      }
    }
    skillCursor.style.display = 'none'; document.getElementById('skill-wrapper').style.visibility = 'hidden';
    setTimeout(() => { staticTextElement.textContent = ""; typeSkill(); }, 500);

    // Hamburger menu script
    const hamburger = document.querySelector('.hamburger'); const navLinks = document.querySelector('.nav-links');
    if (hamburger && navLinks) {
      hamburger.addEventListener('click', () => { navLinks.classList.toggle('active'); hamburger.classList.toggle('toggle'); });
      hamburger.addEventListener('keypress', (e) => { if (e.key === 'Enter') { navLinks.classList.toggle('active'); hamburger.classList.toggle('toggle'); } });
    }
  </script>
  <script>
    // Matrix Rain Effect Script - Configurable Brightness
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    // --- CONFIGURATION VARIABLES ---
    const matrixPatternVar = 2; // Set to 1 or 2
                                // Option 1: white-with-random-green-characters (Simpler version)
                                // Option 2: white-character-leading-green-characters (Stream version)

    // Brightness and Color Configuration
    const leadingCharColor = '#FFFFFF'; // Brighter: '#FFFFFF', Dimmer: '#DDDDDD' or '#CCCCCC'
    const trailCharColor = '#00DD00';   // Brighter: '#00FF00', Dimmer: '#00DD00' or '#00AA00'
    const fadeRectAlpha = 0.05;         // Trail length/density. Higher = shorter/dimmer trails (e.g., 0.1). Lower = longer/denser (e.g., 0.03)
    // -----------------------------

    let canvasWidth = window.innerWidth;
    let canvasHeight = window.innerHeight;
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズヅブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const nums = '0123456789';
    const symbols = '$*+Я=/ЭкЛд';

    const alphabet = katakana + latin + nums + symbols;
    const fontSize = 16;
    let columns = Math.floor(canvasWidth / fontSize);

    const rainDrops = [];
    const streamChars = [];
    const streamLength = [];
    const maxStreamLength = 20;

    function initializeStreams() {
        columns = Math.floor(canvasWidth / fontSize);
        rainDrops.length = 0;
        streamChars.length = 0;
        streamLength.length = 0;

        for (let i = 0; i < columns; i++) {
            if (matrixPatternVar === 1) {
                rainDrops[i] = 1;
            } else {
                rainDrops[i] = Math.random() * -canvasHeight;
                streamChars[i] = [];
                streamLength[i] = Math.floor(Math.random() * maxStreamLength / 2) + Math.floor(maxStreamLength / 2);
            }
        }
    }
    initializeStreams();

    const drawMatrix = () => {
      ctx.fillStyle = `rgba(0, 0, 0, ${fadeRectAlpha})`; // Use configured alpha for fading
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);
      ctx.font = fontSize + 'px monospace';

      if (matrixPatternVar === 1) {
        for (let i = 0; i < rainDrops.length; i++) {
          const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
          ctx.fillStyle = leadingCharColor; // Use configured color
          ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

          if (rainDrops[i] * fontSize > fontSize * 10 && Math.random() > 0.95) {
            ctx.fillStyle = trailCharColor; // Use configured color
            if (rainDrops[i] > 1) {
              for (let j = 1; j < Math.floor(Math.random() * 5) + 2; j++) {
                 if (rainDrops[i]-j > 0) {
                    const randomTrailChar = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                    ctx.fillText(randomTrailChar, i * fontSize, (rainDrops[i] - j) * fontSize);
                 }
              }
            }
          }
          if (rainDrops[i] * fontSize > canvasHeight && Math.random() > 0.975) {
            rainDrops[i] = 0;
          }
          rainDrops[i]++;
        }
      } else { // matrixPatternVar === 2 or default
        for (let i = 0; i < columns; i++) {
          const newChar = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
          streamChars[i].unshift(newChar);

          if (streamChars[i].length > streamLength[i]) {
            streamChars[i].pop();
          }

          for (let k = 0; k < streamChars[i].length; k++) {
            const charToDraw = streamChars[i][k];
            const yPos = (rainDrops[i] - k) * fontSize;

            if (yPos < 0 || yPos > canvasHeight) continue;

            if (k === 0) {
              ctx.fillStyle = leadingCharColor; // Use configured color
            } else {
              ctx.fillStyle = trailCharColor; // Use configured color
            }
            ctx.fillText(charToDraw, i * fontSize, yPos);
          }
          rainDrops[i]++;
          if (rainDrops[i] * fontSize - (streamLength[i] * fontSize) > canvasHeight && Math.random() > 0.975) {
            rainDrops[i] = 0;
            streamChars[i] = [];
            streamLength[i] = Math.floor(Math.random() * maxStreamLength / 2) + Math.floor(maxStreamLength / 2);
          }
        }
      }
    };

    let animationInterval = setInterval(drawMatrix, 50);

    window.addEventListener('resize', () => {
      canvasWidth = window.innerWidth;
      canvasHeight = window.innerHeight;
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      initializeStreams();
    });
  </script>
